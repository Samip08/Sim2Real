# Bridge Configuration for Sim2Real Simulation Round
# Mappings between Gazebo Harmonic and ROS 2 Jazzy

# --- Simulation Time ---
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# --- Actuator Command Velocity ---
- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

# --- Wheel Encoders (Internal Raw Topic) ---
# encoder_noise_node subscribes to this raw topic and publishes noisy /joint_states for contestants
- ros_topic_name: /gz/joint_states_raw
  gz_topic_name: /joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# --- IMU Sensor ---
- ros_topic_name: /imu
  gz_topic_name: /imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

# --- Overhead Camera ---
- ros_topic_name: /overhead_camera/image_raw
  gz_topic_name: /overhead_camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /overhead_camera/camera_info
  gz_topic_name: /overhead_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# --- Ground Truth Odometry (Organizer & Evaluator Only) ---
- ros_topic_name: /evaluator/ground_truth_odom
  gz_topic_name: /gz/odom_internal
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
